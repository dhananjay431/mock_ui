<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">A</div>
    <div class="logo-copy">
      <div class="logo-text">Agentic</div>
      <div class="logo-sub">Expense Manager</div>
    </div>
    <button
      type="button"
      class="sidebar-toggle"
      aria-label="Toggle sidebar"
      (click)="toggleSidebar.emit()"
    >
      <i class="ti" [class.ti-chevrons-left]="!collapsed" [class.ti-chevrons-right]="collapsed"></i>
    </button>
  </div>

  <nav class="nav">
    <a class="nav-item" id="nav-dashboard" routerLink="/dashboard" routerLinkActive="active">
      <i class="ti ti-layout-grid"></i><span class="nav-label">Dashboard</span>
    </a>
    <a
      class="nav-item nav-expenses"
      id="nav-expenses"
      routerLink="/expenses"
      routerLinkActive="active"
    >
      <i class="ti ti-receipt-2"></i><span class="nav-label">Expenses</span>
    </a>
    <a class="nav-item" id="nav-receipts" routerLink="/receipts" routerLinkActive="active">
      <i class="ti ti-file-text"></i><span class="nav-label">Receipts</span>
    </a>
    <a class="nav-item" id="nav-approvals" routerLink="/approvals" routerLinkActive="active">
      <i class="ti ti-checks"></i><span class="nav-label">Approvals</span>
      <span class="nav-badge">12</span>
    </a>
    <a class="nav-item" id="nav-reports" routerLink="/reports" routerLinkActive="active">
      <i class="ti ti-chart-bar-popular"></i><span class="nav-label">Reports</span>
    </a>
    <a class="nav-item" id="nav-budgets" routerLink="/budgets" routerLinkActive="active">
      <i class="ti ti-wallet"></i><span class="nav-label">Budgets</span>
    </a>
    <div class="nav-section">Admin</div>
    <a class="nav-item" id="nav-policies" routerLink="/policies" routerLinkActive="active">
      <i class="ti ti-shield"></i><span class="nav-label">Policies</span>
    </a>
    <a class="nav-item" id="nav-vendors" routerLink="/vendors" routerLinkActive="active">
      <i class="ti ti-building-skyscraper"></i><span class="nav-label">Vendors</span>
    </a>
    <a class="nav-item" id="nav-analytics" routerLink="/analytics" routerLinkActive="active">
      <i class="ti ti-chart-pie"></i><span class="nav-label">Analytics</span>
    </a>
    <a class="nav-item" id="nav-settings" routerLink="/settings" routerLinkActive="active">
      <i class="ti ti-settings"></i><span class="nav-label">Settings</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-av">PS</div>
    <div class="user-copy">
      <div class="user-name">Priya Sharma</div>
      <div class="user-role">Finance Team</div>
    </div>
  </div>
</aside>
