<div class="app" [class.sidebar-collapsed]="sidebarCollapsed()">
  <app-sidebar [collapsed]="sidebarCollapsed()" (toggleSidebar)="toggleSidebar()"> </app-sidebar>
  <div class="main">
    <app-topbar> </app-topbar>
    <div class="content">
      <router-outlet />
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <i class="ti ti-circle-check"></i>
  <div id="toast-msg">Action completed</div>
</div>
<!-- AI WIDGET -->
<div class="ai-widget">
  <div class="ai-bubble">
    I'm analyzing this expense batch and will help you complete the review.
  </div>
  <div style="display: flex; align-items: center">
    <div class="ai-avatar"><i class="ti ti-robot" style="color: #fff; font-size: 18px"></i></div>
    <div class="ai-status"><span class="active-dot"></span>Active</div>
  </div>
</div>
